{% extends 'base.html' %}
{% block title %}Ajouter un stage - StageTracker{% endblock %}

{% block content %}
<h2 class="text-xl font-semibold mb-6">Ajouter un stage</h2>

<form method="POST" class="bg-white p-6 rounded shadow-md max-w-xl mx-auto">
    <label class="block mb-2">Entreprise</label>
    <input type="text" name="entreprise" required class="w-full mb-4 p-2 border rounded">

    <label class="block mb-2">Poste</label>
    <input type="text" name="poste" required class="w-full mb-4 p-2 border rounded">

    <label class="block mb-2">Date de début</label>
    <input type="date" name="debut" required class="w-full mb-4 p-2 border rounded">

    <label class="block mb-2">Date de fin</label>
    <input type="date" name="fin" class="w-full mb-4 p-2 border rounded">

    <label class="block mb-2">Description</label>
    <textarea name="description" rows="4" class="w-full mb-4 p-2 border rounded"></textarea>

    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Ajouter</button>
</form>
{% endblock %}
