{% extends 'base.html' %}
{% block title %}Inscription - StageTracker{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Créer un compte</h2>

        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition duration-200">
                S'inscrire
            </button>
        </form>

        <p class="text-sm text-center mt-4 text-gray-600">
            Déjà un compte ?
            <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Connecte-toi ici</a>.
        </p>
    </div>
</div>
{% endblock %}
